# SPARCED-1.4
# Last update: 2025-02-19


# General infos
name: "SPARCED"
header: "Erdem et al., Nat Commun 2022"
location: "input_files"
user: " Jonah R. Huggins"

# Compilation
compilation:
    directory: "input_files"
    files:
      compartments: "Compartments.txt"
      output_parameters: "output_parameters.txt"  # This file is generated upon compilation
      ratelaws: "Ratelaws.txt"
      species: "standard_Species.txt"

# Experiment settings
simulation:
  model: 
    amici: "jupyter_notebooks/SPARCED"
    sbml: "jupyter_notebooks/SPARCED.xml"
  population_size: 1
  verbose: True
  exchange: 30
  data:
    gene_regulation: "GeneReg.txt"
    omics: "OmicsData.txt"

  # Protocol steps
  protocol:
    name: "Experiment_1-Default"
    hybrid: True
    duration: 24.0
    perturbations: 
      parameters: {}
      species: {'E': 0.0, 'INS': 0.0}

  # Individual Model Exceptions
  Exceptions:
    omics:
      Exp RNA: {'RB1': 17, 
                'E2F1': 17,
                'E2F2': 17,
                'E2F3': 17,
                'CCNE1': 17,
                'CCNE2': 17,
                'SKP2': 17,
                'CDC25A': 17,
                'CDC25B': 17,
                'CDC25C': 17,
                'CCNA2': 17,
                'CDKN1B': 17,
                'CDH1': 17,
                'CCNB1': 17,
                'CDC20': 17,
                'WEE1': 17,
                'CHEK1': 17
                }
      kGac: {'Ce': 17,}

    gene_regulation:
      kGac: {'Ce': 0.0} # Placeholder

    Thresholds: # Provide mathematical expressions
      apoptosis_marker: "cPARP > PARP"

  results:
    filename: "Experiment_1-results"
    directory: "results"

